plugins {
    id 'com.android.application' version '9.2.1' apply false
    // AGP 9 compiles Kotlin itself (built-in Kotlin), so the app module never applies
    // org.jetbrains.kotlin.android. Declaring it here, unapplied, only pins the Kotlin
    // compiler version on the build classpath instead of AGP's bundled default.
    // It must match the Compose compiler plugin version below.
    id 'org.jetbrains.kotlin.android' version '2.4.20' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.20' apply false
}
