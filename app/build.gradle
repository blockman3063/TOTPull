plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'io.blockman.totpull'
    compileSdk 37

    defaultConfig {
        applicationId "io.blockman.totpull"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file("../keystore/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            merges += "META-INF/xposed/*"
        }
    }

    lint {
        abortOnError false
    }

    buildFeatures {
        compose true
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    // QR rendering only (no camera / embedded UI); used to show Google Authenticator
    // migration codes for export.
    implementation 'com.google.zxing:core:3.5.3'
    // Camera QR scanner for import; reuses the same zxing core for decoding.
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Compose / miuix UI stack. The BOM pins every androidx.compose artifact.
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.13.0'
    // miuix 0.9.4: Xiaomi HyperOS style Compose Multiplatform UI library.
    implementation 'top.yukonga.miuix.kmp:miuix-ui:0.9.4'
}
